name: Build Naturschule Chat Desktop App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            rust_target: ""
            artifact_name: naturschule-chat-windows
          - platform: macos
            os: macos-latest
            rust_target: "aarch64-apple-darwin,x86_64-apple-darwin"
            artifact_name: naturschule-chat-macos
          - platform: linux
            os: ubuntu-latest
            rust_target: ""
            artifact_name: naturschule-chat-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libfuse2

      - name: Install npm dependencies
        run: npm install

      - name: Build Windows installer (.msi)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          npm run build:windows
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem -File -Filter *.msi | Copy-Item -Destination release-assets/

      - name: Build macOS installer (.dmg)
        if: matrix.platform == 'macos'
        run: |
          npm run build:macos
          mkdir -p release-assets
          cp -f *.dmg release-assets/

      - name: Build Linux AppImage (.AppImage)
        if: matrix.platform == 'linux'
        env:
          NO_STRIP: "1"
        run: |
          npm run build:linux
          mkdir -p release-assets
          cp -f *.AppImage release-assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            APP_VERSION=$(node -p "require('./pake.json').appVersion")
            echo "tag=v${APP_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Naturschule Chat ${{ steps.version.outputs.tag }}"
          body: |
            Desktop-Starter der **Freien Naturschule MSE** (eine Datei pro Betriebssystem):

            - **Windows:** `Naturschule.Chat.msi` *(lädt WebView2 bei Bedarf automatisch nach)*
            - **macOS:** `Naturschule.Chat.dmg` *(Universal: Apple Silicon & Intel)*
            - **Linux:** `naturschule-chat.AppImage` *(direkt ausführbar)*

            Für Eltern gibt es eine kurze Schritt-für-Schritt-Hilfe im Repository unter [`docs/eltern-anleitung.pdf`](../../blob/main/docs/eltern-anleitung.pdf).
          files: artifacts/*
          prerelease: false
